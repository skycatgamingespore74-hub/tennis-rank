<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tennis Rank — Inscription (1/2)</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial;--muted:#aab6d5;--accent:#79a9ff}
      body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%, #243d72,#0b1020 60%);color:#f4f7ff;display:grid;place-items:center;padding:24px}
      main{width:min(100%,520px)}
      .card{padding:20px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.06));border:1px solid rgba(170,190,230,0.12)}
      h1{margin:0 0 8px}
      p.lead{margin:0 0 12px;color:var(--muted)}
      .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
      input{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(12,18,32,0.45);color:inherit}
      .row{display:flex;gap:8px}
      .primary{background:linear-gradient(90deg,var(--accent),#5d8dff);padding:12px;border-radius:999px;border:none;color:#081126;font-weight:800;cursor:pointer}
      .secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px;border-radius:10px;cursor:pointer;color:var(--muted)}
      .small{color:var(--muted);font-size:.95rem}
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="region" aria-labelledby="insc1">
        <h1 id="insc1">Inscription — Étape 1</h1>
        <p class="lead">Renseigne ton nom et ton email. Nous te demanderons un mot de passe à l'étape suivante.</p>

        <div id="msg" aria-live="polite" style="min-height:1.4em"></div>

        <form id="step1" novalidate>
          <div class="field">
            <label for="fullname">Nom complet</label>
            <input id="fullname" name="fullname" type="text" placeholder="Ex: Jean Dupont" required />
          </div>

          <div class="field">
            <label for="pseudo">Pseudo (affiché)</label>
            <input id="pseudo" name="pseudo" type="text" placeholder="Ex: JeanD" required />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="exemple@domaine.com" required />
          </div>

          <div style="display:flex;gap:8px;align-items:center">
            <button type="submit" class="primary">Étape suivante</button>
            <a href="Connect.html" class="secondary" style="text-decoration:none;display:inline-flex;align-items:center;padding:8px 12px;border-radius:8px">Retour</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      $('step1').addEventListener('submit', (e) => {
        e.preventDefault();
        const fullname = $('fullname').value.trim();
        const pseudo = $('pseudo').value.trim();
        const email = $('email').value.trim();
        const msg = document.getElementById('msg');
        msg.textContent = '';

        if (!fullname || !pseudo || !email) {
          msg.innerHTML = '<div style="color:#ffd1d1;padding:8px;border-radius:8px">Tous les champs sont requis.</div>';
          return;
        }
        // Simple email validation
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.innerHTML = '<div style="color:#ffd1d1;padding:8px;border-radius:8px">Email invalide.</div>';
          return;
        }

        // Store partial data and go to step 2
        localStorage.setItem('tr_signup_fullname', fullname);
        localStorage.setItem('tr_signup_pseudo', pseudo);
        localStorage.setItem('tr_signup_email', email);
        window.location.href = 'signupt2.html';
      });
    </script>
  </body>
</html>
