<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Évaluation Tennis Rank</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #f4f7ff; }
      body { margin: 0; padding: 24px; background: radial-gradient(circle at 90% 0%, #283c72, #0b1020 62%); }
      main { width: min(100%, 680px); margin: 0 auto; }
      .logo { width: 96px; height: 96px; border-radius: 24px; object-fit: cover; box-shadow: 0 16px 38px rgba(0,0,0,.3); }
      h1 { margin: 18px 0 12px; font-size: clamp(2rem, 9vw, 3.6rem); line-height: 1; letter-spacing: -.05em; }
      .intro, .result p { color: #aab6d5; line-height: 1.65; }
      .question { margin-top: 16px; padding: 17px; border: 1px solid rgba(170, 190, 230, .2); border-radius: 17px; background: rgba(24, 35, 66, .86); }
      label { display: block; margin-bottom: 9px; color: #dfe7ff; font-weight: 700; }
      select, button { width: 100%; min-height: 47px; padding: 11px 13px; border: 1px solid rgba(170, 190, 230, .22); border-radius: 12px; font: inherit; }
      select { background: #0f1831; color: #f4f7ff; }
      button { margin-top: 20px; border: 0; background: #79a9ff; color: #081126; font-weight: 850; }
      .error { min-height: 1.5em; color: #ff9b93; }
      .result { display: none; margin-top: 24px; padding: 20px; border: 1px solid rgba(143, 224, 214, .35); border-radius: 17px; background: rgba(44, 104, 104, .2); }
      .result.visible { display: block; }
      .rank { display: flex; align-items: center; gap: 14px; }
      .code { display: grid; width: 62px; height: 62px; place-items: center; border-radius: 18px; background: #79a9ff; color: #081126; font-size: 1.8rem; font-weight: 900; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/app/assets/tennis-rank-logo.webp" alt="Logo Tennis Rank" />
      <h1>Découvre ton rang.</h1>
      <p class="intro">Réponds à cinq questions sur ton jeu actuel. Le résultat reste un repère pour choisir ton prochain objectif.</p>
      <form id="assessment">
        <div class="question"><label for="experience">1. Depuis combien de temps joues-tu régulièrement ?</label><select required id="experience"><option value="">Choisir</option><option value="0">Je découvre</option><option value="1">Moins d'un an</option><option value="2">1 à 2 ans</option><option value="3">3 à 5 ans</option><option value="4">Plus de 5 ans</option><option value="5">Je joue en compétition</option></select></div>
        <div class="question"><label for="rally">2. Combien de frappes peux-tu enchaîner ?</label><select required id="rally"><option value="">Choisir</option><option value="0">Je rate souvent après le rebond</option><option value="1">2 à 3 frappes</option><option value="2">4 à 6 frappes</option><option value="3">7 à 10 frappes</option><option value="4">Plus de 10 frappes</option><option value="5">Je varie longueur et direction</option></select></div>
        <div class="question"><label for="serve">3. Comment décrirais-tu ton service ?</label><select required id="serve"><option value="">Choisir</option><option value="0">Je ne sers pas encore</option><option value="1">Avec difficulté</option><option value="2">Régulièrement</option><option value="3">Je vise une zone</option><option value="4">Je varie mes deux balles</option><option value="5">Je construis le point avec</option></select></div>
        <div class="question"><label for="match">4. En match, que fais-tu ?</label><select required id="match"><option value="">Choisir</option><option value="0">Je découvre encore</option><option value="1">Sans plan</option><option value="2">Je tiens un set</option><option value="3">Je construis des points</option><option value="4">J'adapte mon jeu</option><option value="5">Je gère pression et tactique</option></select></div>
        <div class="question"><label for="training">5. Comment t'entraînes-tu ?</label><select required id="training"><option value="">Choisir</option><option value="0">Occasionnellement</option><option value="1">Quand j'en ai l'occasion</option><option value="2">Une fois par semaine</option><option value="3">Avec des objectifs</option><option value="4">Avec un programme</option><option value="5">Avec suivi et analyse</option></select></div>
        <button type="submit">Voir mon résultat</button>
        <p class="error" id="error"></p>
      </form>
      <section class="result" id="result" aria-live="polite">
        <div class="rank"><span class="code" id="code">?</span><div><strong id="label">Ton rang</strong><h2 id="title"></h2></div></div>
        <p id="description"></p>
        <p><strong>Prochaine priorité :</strong> <span id="goal"></span></p>
      </section>
    </main>
    <script>
      const levels = [
        ["E", "Découverte", "Tu prends tes repères", "Installer les bases : prise de raquette, placement et échange court."],
        ["D", "Débutant", "Tu commences à échanger", "Gagner en régularité et viser une zone simple."],
        ["C", "Intermédiaire", "Tu construis le point", "Changer de direction et servir avec plus de sécurité."],
        ["B", "Confirmé", "Tu imposes ton intention", "Construire un plan de jeu et jouer les points importants."],
        ["A", "Avancé", "Tu maîtrises les détails", "Améliorer les transitions, le retour et la qualité sous pression."],
        ["S", "Compétition", "Tu joues pour performer", "Mesurer la performance et progresser avec un plan d'entraînement."]
      ];
      document.querySelector("#assessment").addEventListener("submit", (event) => {
        event.preventDefault();
        const values = ["experience", "rally", "serve", "match", "training"].map((id) => Number(document.querySelector(`#${id}`).value));
        const level = levels[Math.min(5, Math.floor(values.reduce((a, b) => a + b, 0) / (25 / 6)))];
        document.querySelector("#code").textContent = level[0];
        document.querySelector("#label").textContent = `Rang ${level[0]} · ${level[1]}`;
        document.querySelector("#title").textContent = level[2];
        document.querySelector("#description").textContent = "Ton résultat est un repère de départ, à confirmer sur le court.";
        document.querySelector("#goal").textContent = level[3];
        document.querySelector("#result").classList.add("visible");
        document.querySelector("#result").scrollIntoView({ behavior: "smooth", block: "center" });
      });
    </script>
  </body>
</html>
