<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil | Tennis Rank</title>
    <style>
      :root{
        color-scheme: dark;
        --bg: #0b1020;
        --card-from: rgba(255,255,255,0.03);
        --card-to: rgba(0,0,0,0.08);
        --accent-1: #79a9ff;
        --accent-2: #5d8dff;
        --muted: #aab6d5;
        --text: #f4f7ff;
        --panel-border: rgba(170,190,230,0.12);
        --shadow: rgba(0,0,0,0.38);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 0%, #243d72, var(--bg) 60%);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        padding: 24px;
        display: grid;
        place-items: center;
      }

      .container {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
      }

      .card {
        background: linear-gradient(180deg,var(--card-from),var(--card-to));
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 18px 45px var(--shadow);
        padding: clamp(18px, 3vw, 32px);
      }

      .header { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:18px }
      .profile { display:flex; align-items:center; gap:14px }
      .avatar { width:84px; height:84px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#081126; font-weight:800; font-size:1.6rem }

      h1 { margin:0; font-size:clamp(1.6rem,4vw,2.4rem) }
      .subtitle { margin:4px 0 0; color:var(--muted) }

      .nav { display:flex; gap:10px }
      .button{ border-radius:999px; padding:10px 14px; text-decoration:none; font-weight:700 }
      .button.primary { background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#081126 }
      .button.secondary { background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--text); }

      .stats{ display:grid; grid-template-columns: repeat(3,minmax(150px,1fr)); gap:12px; margin-top:18px }
      .stat{ background: rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); border-radius:12px; padding:14px }
      .label{ color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em }
      .value{ margin-top:8px; font-weight:800; font-size:clamp(1.2rem,3vw,1.8rem) }

      .meta{ margin-top:16px; display:grid; gap:10px }
      .info{ display:flex; justify-content:space-between; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03) }
      .info span:first-child{ color:var(--muted) }

      .lang{ position:absolute; top:12px; right:12px }
      .lang select{ padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:var(--text) }

      @media(max-width:640px){ .stats{ grid-template-columns:1fr } .profile{ align-items:flex-start } }
    </style>
  </head>
  <body>
    <div class="lang">
      <select id="langSelect" aria-label="Sélection de la langue">
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <div class="container">
      <div class="card">
        <div class="header">
          <div class="profile">
            <div class="avatar">AM</div>
            <div>
              <h1>Alex Martin</h1>
              <p class="subtitle">Joueur • Niveau Pro • Tennis Rank</p>
            </div>
          </div>

          <div class="nav">
            <a class="button secondary" href="index.html">Index</a>
            <a class="button primary" href="leaderboard.html">Leaderboard</a>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><div class="label">Points</div><div class="value">1840</div></div>
          <div class="stat"><div class="label">Matchs</div><div class="value">42</div></div>
          <div class="stat"><div class="label">Victoires</div><div class="value">31</div></div>
        </div>

        <div class="meta">
          <div class="info"><span>Classement</span><strong>#1</strong></div>
          <div class="info"><span>Rang actuel</span><strong>Elite</strong></div>
          <div class="info"><span>Dernière activité</span><strong>Il y a 2 jours</strong></div>
        </div>
      </div>
    </div>

    <script>
      (function(){
        const sel = document.getElementById('langSelect');
        function applyLocale(loc){ if(!loc) return; document.documentElement.lang = loc; localStorage.setItem('tr_locale', loc); }
        let saved = localStorage.getItem('tr_locale') || (navigator.language || 'fr').split('-')[0] || 'fr';
        if (['fr','de','en','zh'].indexOf(saved) === -1) saved = 'fr';
        sel.value = saved;
        applyLocale(saved);
        sel.addEventListener('change', (e)=>{ applyLocale(e.target.value); location.reload(); });
      })();
    </script>
  </body>
</html>
