<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil | Tennis Rank</title>
    <style>
      :root {
        --bg: #f5f8ff;
        --card: rgba(255,255,255,0.92);
        --card-border: rgba(96, 124, 171, 0.12);
        --text: #1d2939;
        --muted: #5a677d;
        --accent: #2f6fe5;
        --accent-soft: #deebff;
        --green: #25b772;
        --shadow: rgba(18, 40, 80, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #edf5ff 0%, #f9fbff 100%);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
      }

      .container {
        width: min(900px, calc(100% - 32px));
        margin: 60px auto;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        box-shadow: 0 18px 45px var(--shadow);
        padding: clamp(22px, 4vw, 38px);
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 22px;
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 800;
        background: linear-gradient(135deg, #5aa6ff, #688af7);
        color: white;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.7rem);
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 12px 16px;
        text-decoration: none;
        font-weight: 700;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), #6da7ff);
        color: white;
      }

      .button.secondary {
        background: #eef4ff;
        color: var(--text);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 14px;
        margin-top: 30px;
      }

      .stat {
        background: #f7faff;
        border: 1px solid rgba(96, 124, 171, 0.12);
        border-radius: 18px;
        padding: 18px;
      }

      .label {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        margin-top: 12px;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        font-weight: 800;
      }

      .meta {
        margin-top: 30px;
        display: grid;
        gap: 12px;
      }

      .info {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(222, 235, 255, 0.45);
        border: 1px solid rgba(96, 124, 171, 0.08);
      }

      .info span:first-child {
        color: var(--muted);
      }

      .info strong {
        color: var(--text);
      }

      @media (max-width: 640px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .profile {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div class="profile">
            <div class="avatar">AM</div>
            <div>
              <h1>Alex Martin</h1>
              <p class="subtitle">Joueur • Niveau Pro • Tennis Rank</p>
            </div>
          </div>

          <div class="nav">
            <a class="button secondary" href="index.html">Index</a>
            <a class="button primary" href="leaderboard.html">Leaderboard</a>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="label">Points</div>
            <div class="value">1840</div>
          </div>
          <div class="stat">
            <div class="label">Matchs</div>
            <div class="value">42</div>
          </div>
          <div class="stat">
            <div class="label">Victoires</div>
            <div class="value">31</div>
          </div>
        </div>

        <div class="meta">
          <div class="info">
            <span>Classement</span>
            <strong>#1</strong>
          </div>
          <div class="info">
            <span>Rang actuel</span>
            <strong>Elite</strong>
          </div>
          <div class="info">
            <span>Dernière activité</span>
            <strong>Il y a 2 jours</strong>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
