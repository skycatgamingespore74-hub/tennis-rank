<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tennis Rank — Leçon</title>
    <link rel="stylesheet" href="./assets/mimo-ui.css">
    <style>
      :root{--bg:#07111f;--accent:#79a9ff;--muted:#b6c5e2}
      html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#061126,#07111f);color:#edf4ff}
      .wrap{max-width:980px;margin:20px auto;padding:18px}
      .lesson-hero{display:flex;gap:18px;align-items:center;padding:18px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.12));border:1px solid rgba(255,255,255,0.03)}
      .pie{width:120px;height:120px;display:grid;place-items:center;border-radius:999px;background:radial-gradient(circle at 50% 40%,#0f3b1d,#06351b)}
      .lesson-info h1{margin:0;font-size:1.4rem}
      .lesson-info p{margin:6px 0 0;color:var(--muted)}

      .card{margin-top:16px;padding:18px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(0,0,0,0.06));border:1px solid rgba(255,255,255,0.03)}
      .question{font-weight:900}
      .answers{display:grid;gap:10px;margin-top:12px}
      .answer-btn{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#edf4ff;text-align:left;cursor:pointer;font-weight:800}
      .controls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
      .btn.primary{background:linear-gradient(90deg,var(--accent),#5d8dff);color:#081126;padding:10px 16px;border-radius:999px;border:none;font-weight:900}
      .muted{color:var(--muted)}
      @media(max-width:760px){.lesson-hero{flex-direction:column;align-items:flex-start}.pie{width:88px;height:88px}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <header style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:12px"><img src="./assets/tennis-rank-logo.webp" alt="logo" style="width:42px;height:42px;border-radius:10px"><strong>Tennis Rank</strong></div>
        <nav><a href="leaderboard.html" class="btn ghost" style="padding:8px 12px">Leaderboard</a></nav>
      </header>

      <section class="lesson-hero">
        <div class="pie" aria-hidden="true"><div style="text-align:center"><div style="font-size:22px;font-weight:900">45%</div><div style="font-size:11px;color:var(--muted)">progress</div></div></div>
        <div class="lesson-info">
          <h1>Leçon : Service — Position</h1>
          <p class="muted">Objectif : stabilité et placement du corps — micro‑leçon</p>
        </div>
      </section>

      <article class="card" role="main" aria-labelledby="qtitle">
        <div id="qtitle" class="question">Quel pied doit être en avant pour un service stable ?</div>
        <div class="answers" id="answers"></div>
        <div id="feedback" style="margin-top:10px;font-weight:800"></div>

        <div class="controls">
          <div style="color:var(--muted)">Niveau: <strong id="level">Débutant</strong></div>
          <div>
            <button id="skipBtn" class="btn ghost">Suivant</button>
            <button id="validateBtn" class="btn primary">Valider</button>
          </div>
        </div>
      </article>
    </div>

    <script>
      const answers=['Pied avant naturel','Pied arrière','Les deux pieds de même côté','Aucun pied'];
      const answersWrap=document.getElementById('answers');
      let answered=false;
      answers.forEach((a,i)=>{
        const b=document.createElement('button'); b.className='answer-btn'; b.textContent=a; b.type='button';
        b.addEventListener('click', ()=>{
          if(answered) return; answered=true;
          document.querySelectorAll('.answer-btn').forEach(x=>x.disabled=true);
          if(i===0){ b.style.background='linear-gradient(90deg,#7fe3a6, #79a9ff)'; b.style.color='#062314'; document.getElementById('feedback').textContent='Bonne réponse !'; }
          else{ b.style.background='rgba(255,138,128,0.12)'; document.getElementById('feedback').textContent='Presque — essaie la suivante.'; }
        });
        answersWrap.appendChild(b);
      });

      document.getElementById('skipBtn').addEventListener('click', ()=>{ window.location.reload(); });
      document.getElementById('validateBtn').addEventListener('click', ()=>{ if(!answered){ alert('Choisis une réponse avant de valider.'); return;} alert('Leçon terminée — +100 XP (simulation)'); window.location.href='leaderboard.html'; });
    </script>
  </body>
</html>
