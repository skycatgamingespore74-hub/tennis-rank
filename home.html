<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="title">Accueil | Tennis Rank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: dark;
        --bg:#0b1020;
        --card-from: rgba(255,255,255,0.03);
        --card-to: rgba(0,0,0,0.08);
        --accent-1:#79a9ff;
        --accent-2:#5d8dff;
        --muted:#aab6d5;
        --text:#f4f7ff;
        --border:rgba(170,190,230,0.12);
        --shadow:rgba(0,0,0,0.38);
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%, #243d72, var(--bg) 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:24px}
      main{width:min(100%,920px);margin:0 auto;padding:24px}
      .card{background:linear-gradient(180deg,var(--card-from),var(--card-to));border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 24px 70px var(--shadow);position:relative;overflow:hidden}
      .brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
      .brand{display:inline-flex;align-items:center;gap:12px;font-weight:800}
      .brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#081126;font-weight:900}
      .lang{position:absolute;top:14px;right:14px}
      .lang select{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text)}
      .logo-wrap{width:120px;height:120px;margin:8px 0 18px;border-radius:18px;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,0.18)}
      h1{margin:0 0 14px;font-size:clamp(1.8rem,4vw,3.6rem)}
      .eyebrow{margin:0 0 8px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
      .subtitle{margin:0 0 18px;color:var(--muted);max-width:720px}
      .cta-row{display:flex;gap:12px;flex-wrap:wrap}
      .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:999px;font-weight:800;border:none;cursor:pointer}
      .btn.primary{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:#081126}
      .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--text)}
      .scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:20px}
      .rank-step{display:grid;place-items:center;min-height:48px;border-radius:12px;background:rgba(255,255,255,0.02);font-weight:800}
      .legal-links{margin-top:18px;display:flex;gap:10px}
      .legal-links a{color:var(--text);text-decoration:none;padding:8px 12px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.02)}
      @media(max-width:700px){.scale{grid-template-columns:repeat(3,1fr)}.cta-row{flex-direction:column}.logo-wrap{width:100px;height:100px}}
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="main">
        <div class="lang">
          <select id="tr_lang" aria-label="Langue">
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="zh">中文</option>
          </select>
        </div>

        <header class="brand-row">
          <a class="brand" href="#" data-i18n="brand_name"><span class="brand-mark">T</span><span style="margin-left:8px">Tennis Rank</span></a>
        </header>

        <div class="logo-wrap">
          <img src="./assets/tennis-rank-logo.webp" alt="Tennis Rank" />
        </div>

        <p class="eyebrow" data-i18n="eyebrow">Tennis Rank · Tennis Levels</p>
        <h1 data-i18n="hero_title">Trouve ton niveau.<br/>Fais progresser ton jeu.</h1>
        <p class="subtitle" data-i18n="hero_sub">Tennis Levels t’aide à mieux comprendre ton niveau de tennis et à fixer le bon prochain objectif, étape par étape.</p>

        <div class="cta-row">
          <button class="btn primary" id="btn_levels" data-i18n="cta_levels">Voir les niveaux</button>
          <button class="btn secondary" id="btn_assess" data-i18n="cta_assess">Évaluer mon niveau</button>
        </div>

        <div class="scale" aria-hidden="true">
          <span class="rank-step">E</span>
          <span class="rank-step">D</span>
          <span class="rank-step">C</span>
          <span class="rank-step">B</span>
          <span class="rank-step">A</span>
          <span class="rank-step">S</span>
        </div>

        <div class="legal-links">
          <a href="conditions-utilisation.html" data-i18n="terms">Conditions d’utilisation</a>
          <a href="politique-confidentialite.html" data-i18n="privacy">Règlement de confidentialité</a>
        </div>
      </div>
    </main>

    <script>
      // Client-side translations (no API). Add keys for any text you want to translate.
      (function(){
        const translations = {
          fr: {
            title: 'Accueil | Tennis Rank',
            brand_name: 'Tennis Rank',
            eyebrow: 'Tennis Rank · Tennis Levels',
            hero_title: 'Trouve ton niveau.\nFais progresser ton jeu.',
            hero_sub: "Tennis Levels t'aide à mieux comprendre ton niveau de tennis et à fixer le bon prochain objectif, étape par étape.",
            cta_levels: 'Voir les niveaux',
            cta_assess: 'Évaluer mon niveau',
            terms: "Conditions d'utilisation",
            privacy: 'Règlement de confidentialité'
          },
          en: {
            title: 'Home | Tennis Rank',
            brand_name: 'Tennis Rank',
            eyebrow: 'Tennis Rank · Tennis Levels',
            hero_title: 'Find your level.\nImprove your game.',
            hero_sub: "Tennis Levels helps you better understand your tennis level and set the right next goal, step by step.",
            cta_levels: 'See levels',
            cta_assess: 'Assess my level',
            terms: 'Terms of use',
            privacy: 'Privacy policy'
          },
          de: {
            title: 'Start | Tennis Rank',
            brand_name: 'Tennis Rank',
            eyebrow: 'Tennis Rank · Tennis Levels',
            hero_title: 'Finde dein Level.\nBringe dein Spiel voran.',
            hero_sub: 'Tennis Levels hilft dir, dein Tennisniveau besser zu verstehen und schrittweise das richtige nächste Ziel zu setzen.',
            cta_levels: 'Level anzeigen',
            cta_assess: 'Mein Niveau testen',
            terms: 'Nutzungsbedingungen',
            privacy: 'Datenschutzbestimmungen'
          },
          zh: {
            title: '首页 | Tennis Rank',
            brand_name: 'Tennis Rank',
            eyebrow: 'Tennis Rank · Tennis Levels',
            hero_title: '找到你的等级。\n提升你的比赛。',
            hero_sub: 'Tennis Levels 可帮助你更好地了解网球水平并逐步设定正确的下一个目标。',
            cta_levels: '查看等级',
            cta_assess: '评估我的水平',
            terms: '使用条款',
            privacy: '隐私政策'
          }
        };

        const supported = ['fr','en','de','zh'];
        const sel = document.getElementById('tr_lang');
        function applyLocale(loc){
          if(!loc || supported.indexOf(loc)===-1) loc='fr';
          const dict = translations[loc] || translations.fr;
          // set document lang and title
          document.documentElement.lang = loc;
          if(dict.title) document.title = dict.title;
          // find all elements with data-i18n and set text (supports \n => <br>)
          document.querySelectorAll('[data-i18n]').forEach(el=>{
            const key = el.getAttribute('data-i18n');
            if(!key) return;
            const val = dict[key];
            if(val===undefined) return;
            if(el.tagName.toLowerCase()==='input' || el.tagName.toLowerCase()==='textarea'){
              el.value = val;
            } else if(el.tagName.toLowerCase()==='title'){
              el.textContent = val;
            } else {
              // preserve basic markup (allow <br>)
              el.innerHTML = val.includes('\n') ? val.split('\n').map(s => escapeHtml(s)).join('<br/>') : escapeHtml(val);
            }
          });
          localStorage.setItem('tr_locale', loc);
        }

        function escapeHtml(s){ return s.replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

        // init
        let saved = localStorage.getItem('tr_locale') || (navigator.language||'fr').split('-')[0];
        if(supported.indexOf(saved)===-1) saved='fr';
        sel.value = saved;
        applyLocale(saved);

        sel.addEventListener('change', function(e){ applyLocale(e.target.value); });

        // expose for debugging
        window.tr_i18n_apply = applyLocale;
      })();
    </script>
  </body>
</html>
