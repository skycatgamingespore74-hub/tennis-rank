<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accueil Tennis Levels</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #f4f7ff; }
      body { margin: 0; padding: 24px; background: radial-gradient(circle at 20% 0%, #243d72, #0b1020 60%); }
      main { width: min(100%, 680px); margin: 0 auto; }
        .logo { width: 112px; height: 112px; border-radius: 28px; object-fit: cover; box-shadow: 0 18px 44px rgba(0,0,0,.32); }
        .badge { color: #8fe0d6; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 18px 0 14px; font-size: clamp(2.3rem, 10vw, 4.4rem); line-height: .98; letter-spacing: -.06em; }
      p { color: #aab6d5; font-size: 1.08rem; line-height: 1.65; }
      a { display: inline-block; margin-top: 18px; padding: 13px 18px; border-radius: 999px; background: #79a9ff; color: #081126; font-weight: 800; text-decoration: none; }
        .rank-scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 28px; }
        .rank-step { padding: 10px 4px; border: 1px solid rgba(170, 190, 230, .2); border-radius: 11px; color: #aab6d5; font-weight: 800; text-align: center; }
        .rank-step:nth-child(1) { color: #ff5a4f; } .rank-step:nth-child(2) { color: #ffb426; }
        .rank-step:nth-child(3) { color: #f1ef39; } .rank-step:nth-child(4) { color: #75ed33; }
        .rank-step:nth-child(5) { color: #62d7ff; } .rank-step:nth-child(6) { color: #c779ff; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; }
        .links a { margin-top: 18px; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/app/assets/tennis-rank-logo.webp" alt="Logo Tennis Rank" />
      <p class="badge">Tennis Rank · Tennis Levels</p>
      <h1>Trouve ton niveau. Fais progresser ton jeu.</h1>
      <p>
        Tennis Levels t'aide à comprendre ton niveau de tennis et à choisir
        ton prochain objectif, étape par étape.
      </p>
      <a href="levels.html">Voir les niveaux</a>
      <div class="links">
        <a href="assessment.html">Évaluer mon niveau</a>
      </div>
      <div class="rank-scale" aria-label="Échelle Tennis Rank de E à S">
        <span class="rank-step">E</span><span class="rank-step">D</span><span class="rank-step">C</span>
        <span class="rank-step">B</span><span class="rank-step">A</span><span class="rank-step">S</span>
      </div>
    </main>
  </body>
</html>
