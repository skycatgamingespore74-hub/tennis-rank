<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis-Rank - Maintenance</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #0b2f8a 0%, #1c6dd9 55%, #2f9bff 100%);
  color: white;
  text-align: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body.disco {
  background: linear-gradient(135deg, red, orange, yellow, green, blue, violet, red);
  background-size: 400% 400%;
  animation: discoBg 2s linear infinite;
}
@keyframes discoBg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
body.goldmode {
  background: linear-gradient(160deg, #3a2a00, #b38f00 60%, #ffcc00);
  color: #111;
}

.topbar {
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(6px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.topbar h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }
.badge {
  background: #ffcc00;
  color: black;
  border-radius: 20px;
  padding: 6px 14px;
  font-weight: bold;
  font-size: 13px;
}

.hero {
  flex: 1;
  padding: 30px 18px 20px 18px;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}
.logo {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 3px solid white;
  object-fit: cover;
  background: white;
}
h1 {
  font-size: 32px;
  margin: 14px 0 6px 0;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  cursor: pointer;
}
.subtitle {
  opacity: 0.95;
  font-size: 17px;
  max-width: 520px;
  margin: 0 auto 20px auto;
  line-height: 1.5;
}

.card {
  background: white;
  color: #0b2f8a;
  border-radius: 18px;
  padding: 20px;
  border: 4px solid #000;
  box-shadow: 0 10px 0 rgba(0,0,0,0.2);
  margin-bottom: 18px;
}
.timer {
  font-size: 22px;
  font-weight: bold;
  font-family: monospace;
  margin-bottom: 12px;
}
.progress-bg {
  background: #e0e0e0;
  border-radius: 10px;
  height: 14px;
  overflow: hidden;
  border: 2px solid #000;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #1e90ff, #2f9bff);
  transition: width 1s linear;
}

.btn-ok {
  display: inline-block;
  background: #ffcc00;
  border: 4px solid #000;
  border-radius: 12px;
  padding: 14px 60px;
  font-size: 24px;
  font-weight: bold;
  color: black;
  box-shadow: 0 6px 0 #b38f00;
  cursor: pointer;
  user-select: none;
  margin-top: 6px;
}
.btn-ok:active { transform: scale(0.97); }

.stripe {
  height: 22px;
  background: repeating-linear-gradient(-45deg, #ffcc00 0 30px, #111 30px 60px);
  background-size: 85px 100%;
  animation: slide 0.7s linear infinite;
  cursor: pointer;
}
@keyframes slide { from { background-position: 0 0; } to { background-position: 85px 0; } }

.lights {
  display: flex;
  justify-content: center;
  gap: 18px;
  padding: 10px;
}
.light {
  width: 26px;
  height: 26px;
  background: red;
  border-radius: 50%;
  box-shadow: 0 0 12px red;
  animation: blink 0.8s infinite;
  cursor: pointer;
}
.light.delay { animation-delay: 0.4s; background: #ffcc00; box-shadow: 0 0 12px #ffcc00; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

#eggMsg {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: black;
  color: #ffcc00;
  padding: 12px 20px;
  border-radius: 10px;
  border: 2px solid #ffcc00;
  display: none;
  font-weight: bold;
  z-index: 999;
  max-width: 90%;
}
.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 14px;
  z-index: 998;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>
<body>

<div class="stripe" onclick="eggStripe()"></div>

<div class="lights">
  <span class="light" onclick="eggLight()"></span>
  <span class="light delay"></span>
  <span class="light"></span>
</div>

<div class="topbar">
  <h2>TENNIS-RANK</h2>
  <span class="badge">MAINTENANCE</span>
</div>

<div class="hero">
  <img src="https://skycatgamingespore74-hub.github.io/tennis-rank/assets/tennis-rank-logo.webp" alt="logo" class="logo" onclick="eggLogo()">
  <h1 onclick="eggTitle()">Un instant, on améliore le jeu!</h1>
  <p class="subtitle">Le site est en maintenance et en développement. Retour prévu le <b>13 octobre à 15h50</b>. Merci pour ta patience.</p>

  <div class="card">
    <div id="timer" class="timer">Calcul...</div>
    <div class="progress-bg"><div id="progress" class="progress-fill"></div></div>
    <p style="font-size:13px; margin:10px 0 0 0;">Clique sur le timer pour copier l'heure exacte.</p>
  </div>

  <button class="btn-ok" id="okBtn" onclick="eggOkClick()" onpointerdown="startPress()" onpointerup="cancelPress()" onpointerleave="cancelPress()">OK!</button>
  <p style="margin-top:14px; font-size:14px; opacity:0.9;">Version en cours : 1.0 dev + maintenance</p>
</div>

<div class="lights">
  <span class="light delay"></span>
  <span class="light"></span>
  <span class="light delay" onclick="eggLight()"></span>
</div>
<div class="stripe" onclick="eggStripe()"></div>

<div id="eggMsg"></div>

<script>
const endDate = new Date('2026-10-13T15:50:00');
const startDate = new Date('2026-10-12T00:00:00');
function updateTimer() {
  const now = new Date();
  let diff = endDate - now;
  const el = document.getElementById('timer');
  const prog = document.getElementById('progress');
  if (diff <= 0) { el.textContent = "C'est bon, actualise la page!"; prog.style.width = "100%"; return; }
  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
  const secs = Math.floor((diff % (1000*60)) / 1000);
  el.textContent = "Retour dans : " + days + "j " + hours + "h " + mins + "m " + secs + "s";
  let total = endDate - startDate;
  let done = total - diff;
  let pct = Math.min(100, Math.max(0, (done / total) * 100));
  prog.style.width = pct + "%";
}
updateTimer();
setInterval(updateTimer, 1000);

function showEgg(msg) {
  const e = document.getElementById('eggMsg');
  e.textContent = msg;
  e.style.display = 'block';
  setTimeout(() => e.style.display = 'none', 3000);
}

function launchConfetti() {
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = 'hsl(' + Math.random()*360 + ',100%,50%)';
    c.style.animationDuration = (1.5 + Math.random()*2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// 1/7 : les lumières -> MODE DISCO
let c1 = 0;
function eggLight() {
  c1++;
  if (c1 >= 5) {
    document.body.classList.toggle('disco');
    showEgg("Easter Egg 1/7: MODE DISCO!");
    launchConfetti();
    c1 = 0;
  } else {
    showEgg("Feu " + c1 + "/5...");
  }
}

// 2/7 : le logo -> SPIN
let c2 = 0;
function eggLogo() {
  c2++;
  const p = document.querySelector('.logo');
  p.style.transform = 'rotate(' + (c2*360) + 'deg)';
  p.style.transition = 'transform 0.8s ease';
  if (c2 >= 3) {
    showEgg("Easter Egg 2/7: Logo tourneur!");
    c2 = 0;
  }
}

// 3/7 : le titre -> arc-en-ciel
let c3 = 0;
function eggTitle() {
  c3++;
  const t = document.querySelector('h1');
  if (c3 >= 4) {
    t.style.color = 'hsl(' + (Math.random()*360) + ',100%,50%)';
    showEgg("Easter Egg 3/7: Titre magique!");
    c3 = 0;
  } else {
    showEgg("Titre " + c3 + "/4...");
  }
}

// 4/7 : les bandes -> mode GOLD
let c4 = 0;
function eggStripe() {
  c4++;
  if (c4 >= 2) {
    document.body.classList.toggle('goldmode');
    showEgg("Easter Egg 4/7: MODE GOLD!");
    c4 = 0;
  } else {
    showEgg("Bande " + c4 + "/2...");
  }
}

// 5/7 : le timer -> copie l'heure
document.getElementById('timer').onclick = function() {
  navigator.clipboard.writeText(endDate.toLocaleString('fr-FR'));
  showEgg("Easter Egg 5/7: Heure copiée!");
};

// 6/7 : le bouton OK -> confettis + effet presse
function startPress() {
  const b = document.getElementById('okBtn');
  b.style.transform = 'scale(0.95)';
  b.style.boxShadow = '0 2px 0 #b38f00';
}
function cancelPress() {
  const b = document.getElementById('okBtn');
  b.style.transform = 'scale(1)';
  b.style.boxShadow = '0 6px 0 #b38f00';
}
let c6 = 0;
function eggOkClick() {
  c6++;
  cancelPress();
  launchConfetti();
  if (c6 >= 5) {
    showEgg("Easter Egg 6/7: FOU DE CONFETTIS!");
    document.body.classList.toggle('disco');
    c6 = 0;
  } else {
    showEgg("OK " + c6 + "/5...");
  }
}

// 7/7 : tape TENNIS sur ton clavier -> MODE SPLENDIDE
let code = "";
document.addEventListener('keydown', function(e) {
  code += e.key.toLowerCase();
  if (code.length > 6) code = code.slice(-6);
  if (code === "tennis") {
    document.body.classList.add('disco');
    launchConfetti();
    showEgg("Easter Egg 7/7: MODE SPLENDIDE TENNIS!");
    code = "";
  }
});
</script>
</body>
  </html>
