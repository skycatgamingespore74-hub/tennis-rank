<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance</title>
<style>
body {
margin: 0;
font-family: Arial Black, Arial, sans-serif;
background: linear-gradient(#0b2f8a, #1c6dd9 60%, #2f9bff);
color: white;
text-align: center;
min-height: 100vh;
display: flex;
flex-direction: column;
}
body.disco {
background: linear-gradient(135deg, red, orange, yellow, green, blue, violet, red);
background-size: 400% 400%;
animation: discoBg 2s linear infinite;
}
@keyframes discoBg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

.stripes {
height: 28px;
background: repeating-linear-gradient(-45deg, #ffcc00 0 30px, #111 30px 60px);
background-size: 85px 100%;
animation: slide 0.7s linear infinite;
}
@keyframes slide { from { background-position: 0 0; } to { background-position: 85px 0; } }

.header {
background: #191970;
display: flex;
justify-content: space-between;
align-items: center;
padding: 14px 16px;
}
.header h2 { margin: 0; font-size: 22px; }
.btn-retry {
background: #1e90ff;
border: 3px solid white;
border-radius: 10px;
color: white;
font-weight: bold;
padding: 8px 16px;
font-size: 18px;
font-family: Arial Black, Arial;
}

.lights {
display: flex;
justify-content: space-between;
padding: 12px 20px;
background: #0b2f8a;
}
.light {
display: inline-block;
width: 28px;
height: 28px;
background: red;
border-radius: 50%;
box-shadow: 0 0 12px red;
animation: blink 0.8s infinite;
cursor: pointer;
}
.light.delay { animation-delay: 0.4s; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

.content { flex: 1; padding: 20px 15px; }
.perso {
width: 200px;
max-width: 70%;
height: auto;
cursor: pointer;
}
.perso.spin { animation: spin 0.8s ease; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

h1 {
font-size: 30px;
margin: 10px 0 5px 0;
text-shadow: 2px 2px 0 #000;
cursor: pointer;
}
.subtitle {
font-family: Arial, sans-serif;
font-weight: bold;
font-size: 17px;
max-width: 500px;
margin: 0 auto 18px auto;
}
.timer {
background: white;
color: #0b2f8a;
display: inline-block;
border-radius: 12px;
border: 4px solid #000;
padding: 12px 20px;
font-size: 20px;
font-family: Arial, sans-serif;
font-weight: bold;
margin-bottom: 20px;
min-width: 250px;
}
.btn-ok {
display: block;
margin: 0 auto 10px auto;
background: #ffcc00;
border: 4px solid #000;
border-radius: 12px;
padding: 14px 70px;
font-size: 26px;
font-weight: bold;
font-family: Arial Black, Arial;
color: black;
box-shadow: 0 6px 0 #b38f00;
user-select: none;
}
#eggMsg {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
background: black;
color: #ffcc00;
padding: 12px 20px;
border-radius: 10px;
border: 2px solid #ffcc00;
display: none;
font-family: Arial, sans-serif;
font-weight: bold;
z-index: 999;
max-width: 90%;
}
</style>
</head>
<body>

<div class="stripes"></div>
<div class="lights">
<span class="light" id="light1" onclick="eggLight()"></span>
<span class="light delay"></span>
</div>

<div class="header">
<h2>Maintenance</h2>
<button class="btn-retry" onclick="location.reload()">Réessayer</button>
</div>

<div class="content">
<img id="perso" onclick="eggPerso()" src="https://www.pngall.com/wp-content/uploads/2016/05/Construction-Worker-PNG-Image.png" alt="ouvrier" class="perso">
<h1 id="mainTitle" onclick="eggTitle()">Un instant, svp!</h1>
<p class="subtitle">Une maintenance est en cours. Le site sera de retour le 13 octobre à 15h50.</p>

<div id="timer" class="timer">Calcul...</div>
<button class="btn-ok" id="okBtn" onclick="eggOkClick()" onpointerdown="startPress()" onpointerup="cancelPress()" onpointerleave="cancelPress()">OK!</button>
</div>

<div class="lights">
<span class="light delay"></span>
<span class="light"></span>
</div>
<div class="stripes"></div>

<div id="eggMsg"></div>

<script>
const endDate = new Date('2026-10-13T15:50:00');
function updateTimer() {
const now = new Date();
let diff = endDate - now;
const el = document.getElementById('timer');
if (diff <= 0) { el.textContent = "C'est bon, actualise la page!"; return; }
const days = Math.floor(diff / (1000606024));
const hours = Math.floor((diff % (1000606024)) / (10006060));
const mins = Math.floor((diff % (10006060)) / (100060));
const secs = Math.floor((diff % (100060)) / 1000);
el.textContent = "Retour dans : " + days + "j " + hours + "h " + mins + "m " + secs + "s";
}
updateTimer();
setInterval(updateTimer, 1000);

function showEgg(msg) {
const e = document.getElementById('eggMsg');
e.textContent = msg;
e.style.display = 'block';
setTimeout(() => e.style.display = 'none', 3000);
}

let c1 = 0;
function eggLight() {
c1++;
if (c1 >= 5) {
document.body.classList.toggle('disco');
showEgg("Easter Egg 1/4: MODE DISCO activé!");
c1 = 0;
} else {
showEgg("Feu " + c1 + "/5...");
}
}

function eggPerso() {

p.classList.remove('spin');
void p.offsetWidth;
p.classList.add('spin');
if (c2 >= 3) {
showEgg("Easter Egg 2/4: L'ouvrier te dit merci!");
c2 = 0;
}
}

if (c3 >= 4)
