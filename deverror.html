<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tennis Rank — En développement</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial}
      body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0b1020,#071126);color:#f6fbff;display:grid;place-items:center;padding:24px}
      .card{max-width:720px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.06));border-radius:16px;padding:28px;border:1px solid rgba(255,255,255,0.03);text-align:center}
      h1{margin:0 0 8px;font-size:1.8rem}
      p.lead{color:#c4d3f3;margin:0 0 18px}
      .actions{display:flex;gap:12px;justify-content:center;margin-top:18px}
      .btn{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:700}
      .primary{background:linear-gradient(90deg,#79a9ff,#5d8dff);color:#081126}
      .linkish{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#e6f0ff}
      .small{color:#9fb0da;margin-top:12px}
      .log{margin-top:16px;text-align:left;background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;color:#dfe8ff;font-size:.95rem;max-height:180px;overflow:auto}
    </style>
  </head>
  <body>
    <div class="card" role="main" aria-labelledby="dev-title">
      <h1 id="dev-title">En développement</h1>
      <p class="lead">Cette section de l'application est en cours d'amélioration pour une expérience mobile plus fluide. Merci pour ta patience !</p>

      <div class="actions" role="navigation">
        <button class="btn primary" onclick="goHome()">Retour à l'accueil</button>
        <button class="btn linkish" onclick="tryAgain()">Réessayer</button>
        <button class="btn linkish" onclick="report()">Signaler un problème</button>
      </div>

      <p class="small">Si tu veux tester une version, ouvre l'outil de développement ou contacte le développeur.</p>

      <div class="log" id="log" aria-live="polite">
        <strong>Info :</strong>
        <ul>
          <li>Utilisateur connecté (localStorage) : <span id="userInfo">—</span></li>
          <li>Temps : <span id="now">—</span></li>
        </ul>
      </div>
    </div>

    <script>
      function goHome(){ window.location.href = 'index.html' || 'Connect.html'; }
      function tryAgain(){ location.reload(); }
      function report(){
        const subject = encodeURIComponent('Rapport - Tennis Rank');
        const body = encodeURIComponent('Bonjour,\n\nJe signale un problème sur la page en développement. Décrivez le problème :\n\n');
        window.location.href = `mailto:dev@exemple.com?subject=${subject}&body=${body}`;
      }

      // Affiche info utile (debug)
      const userInfoEl = document.getElementById('userInfo');
      const nowEl = document.getElementById('now');
      const user = localStorage.getItem('tr_pseudo') || localStorage.getItem('tr_email') || 'non connecté';
      userInfoEl.textContent = user;
      nowEl.textContent = new Date().toLocaleString();
    </script>
  </body>
</html>
