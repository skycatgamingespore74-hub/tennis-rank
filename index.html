<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index des pages | Tennis Rank</title>
    <style>
      :root {
        --bg: #eef5ff;
        --panel: rgba(255,255,255,0.9);
        --panel-border: rgba(96, 124, 171, 0.12);
        --text: #1f2a37;
        --muted: #596a7d;
        --accent: #2f6fe5;
        --accent-soft: #eaf2ff;
        --shadow: rgba(31, 40, 56, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #edf4ff 0%, #f9fbff 100%);
        color: var(--text);
      }

      .container {
        width: min(920px, calc(100% - 30px));
        margin: 62px auto;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 18px 48px var(--shadow);
        padding: clamp(20px, 4vw, 34px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      .sub {
        margin: 0 0 26px;
        color: var(--muted);
        font-size: 1rem;
      }

      .list {
        display: grid;
        gap: 14px;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: #f9fbff;
        border: 1px solid rgba(96, 124, 171, 0.08);
        border-radius: 18px;
        padding: 18px 20px;
      }

      .item strong {
        font-size: 1.02rem;
      }

      .link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        background: var(--accent-soft);
        color: var(--accent);
      }

      @media (max-width: 620px) {
        .item {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>Index de l’application</h1>
        <p class="sub">Navigation rapide vers les principales pages de Tennis Rank.</p>

        <div class="list">
          <div class="item">
            <strong>Accueil</strong>
            <a class="link" href="home.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Connexion</strong>
            <a class="link" href="Connect.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Leaderboard</strong>
            <a class="link" href="leaderboard.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Profil</strong>
            <a class="link" href="profil.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Niveaux</strong>
            <a class="link" href="levels.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Évaluation</strong>
            <a class="link" href="assessment.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Inscription étape 1</strong>
            <a class="link" href="signupt1.html">Ouvrir</a>
          </div>
          <div class="item">
            <strong>Inscription étape 2</strong>
            <a class="link" href="signupt2.html">Ouvrir</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
