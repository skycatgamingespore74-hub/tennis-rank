<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tennis Rank — Connexion</title>
    <style>
      :root{ color-scheme: dark; --bg: #0b1020; --card-from: rgba(255,255,255,0.03); --card-to: rgba(0,0,0,0.08); --accent-1: #79a9ff; --accent-2: #5d8dff; --muted: #aab6d5; font-family: Inter, system-ui, sans-serif; }
      *{box-sizing:border-box} html,body{height:100%} body{ margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0%, #243d72, var(--bg) 60%); color:#f4f7ff; display:grid; place-items:center; padding:18px; }
      #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
      main{width:min(100%,460px);z-index:2}
      .card{ width:100%; background:linear-gradient(180deg,var(--card-from),var(--card-to)); border:1px solid rgba(170,190,230,0.18); border-radius:18px; padding:22px; box-shadow:0 18px 44px rgba(0,0,0,.35); position:relative; overflow:hidden; }
      .logo-wrap{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:12px}
      .logo-shell{width:96px;height:96px;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.32);background:linear-gradient(135deg,var(--accent-1),var(--accent-2));position:relative;transition:transform .25s ease, box-shadow .25s ease}
      .logo-shell img{width:84px;height:84px;object-fit:cover;border-radius:14px;display:block}
      .logo-shell::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));mix-blend-mode:screen;transform:translateX(-60%);transition:transform .8s ease}
      .logo-shell:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 30px 70px rgba(37,85,170,0.22)}
      .logo-shell:hover::after{transform:translateX(60%)}
      .badge{color:#8fe0d6;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-align:center;font-size:.75rem;margin:0 0 8px}
      h1{text-align:center;margin:0 0 8px;font-size:clamp(1.6rem,6vw,2.2rem)}
      .lead{text-align:center;color:var(--muted);margin:0 0 18px}
      form .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
      label{font-weight:700;color:#dbe8ff;font-size:.95rem}
      input[type="text"],input[type="email"],input[type="password"]{ padding:12px 14px;border-radius:12px;border:1px solid rgba(170,190,230,0.12); background:linear-gradient(180deg, rgba(12,18,32,0.7), rgba(12,18,32,0.5)); color:#f4f7ff; font-size:1rem; outline:none; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease }
      input::placeholder{color:#9fb0da}
      input:focus{box-shadow:0 6px 30px rgba(89,124,255,0.12), inset 0 0 0 1px rgba(121,169,255,0.06);transform:translateY(-1px)}
      .controls{display:flex;gap:8px;align-items:center;justify-content:space-between; margin:8px 0 14px}
      .inline{color:var(--muted); font-size:.9rem; display:flex; align-items:center; gap:8px}
      .primary-btn{width:100%;padding:13px;border-radius:999px;border:none;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:#081126;font-weight:800;cursor:pointer;box-shadow:0 12px 26px rgba(93,141,255,.28); transition:transform .15s ease, filter .15s ease; position:relative; overflow:hidden}
      .primary-btn:hover{filter:brightness(1.03)}
      .primary-btn:active{transform:translateY(1px)}
      .secondary{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(170,190,230,0.10);color:#dfe8ff;font-weight:700;cursor:pointer}
      .small{font-size:.9rem;color:var(--muted);text-align:center;margin-top:12px}
      .divider{text-align:center;color:var(--muted);margin:14px 0}
      .google-wrap{display:flex;justify-content:center;align-items:center;position:relative}
      .google-bg{position:absolute;width:220px;height:62px;border-radius:999px;background:linear-gradient(90deg, rgba(121,169,255,0.12), rgba(93,141,255,0.08));filter:blur(8px);opacity:0.95;transform:scale(.98);animation:glow 2.5s ease-in-out infinite}
      @keyframes glow{0%{transform:scale(.98)}50%{transform:scale(1.06)}100%{transform:scale(.98)}}
      .google-btn-custom{display:inline-flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border:1px solid rgba(170,190,230,0.12);color:#edf4ff;font-weight:700;cursor:pointer;position:relative;overflow:hidden}
      .google-logo{width:20px;height:20px;border-radius:4px;display:inline-block;background-image:url('./assets/google-icon.png');background-size:contain;background-repeat:no-repeat}
      .google-text{font-size:0.95rem}
      .google-btn-custom:active{transform:translateY(1px) scale(.997)}
      .ripple{position:absolute;border-radius:50%;transform:scale(0);opacity:.6;background:rgba(255,255,255,0.18);pointer-events:none}
      .error{color:#ffd1d1;background:rgba(255,210,210,0.04);border-radius:10px;padding:8px;margin-bottom:8px;border:1px solid rgba(255,180,180,0.06)}
      .password-row{display:flex;gap:8px}
      .toggle-pass{padding:10px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);cursor:pointer;color:var(--muted)}
      .splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(36,61,114,0.96),rgba(11,16,32,0.98));z-index:6}
      .splash .logo-shell{width:180px;height:180px;border-radius:26px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(37,85,170,.32);animation:logo-pop .9s ease-out}
      .splash img{width:120px;height:120px;object-fit:cover;border-radius:20px;display:block}
      @keyframes logo-pop{0%{transform:scale(.36) rotate(-6deg);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)} }
      .splash.hide{animation:fadeOut .6s ease forwards;animation-delay:.95s}
      @keyframes fadeOut{to{opacity:0;visibility:hidden;transform:translateY(-8px)}}
      .card.float{animation:cardFloat 6s ease-in-out infinite}
      @keyframes cardFloat{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
      .legal-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:.85rem}
      .legal-links a{color:#cfe0ff;text-decoration:none}
      @media(max-width:480px){body{padding:18px}.card{padding:16px}.controls{flex-direction:column;align-items:stretch}.secondary{width:100%}}
      @media (prefers-reduced-motion: reduce) {.splash, .logo-shell, .card.float, .google-bg{animation: none !important; transition: none !important}}
    </style>
  </head>
  <body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <div class="splash" id="splash" role="img" aria-hidden="true">
      <div class="logo-shell">
        <img src="./assets/tennis-rank-logo.webp" alt="Tennis Rank" />
      </div>
    </div>

    <main>
      <div class="card float" role="region" aria-labelledby="login-title">
        <div class="logo-wrap">
          <div class="logo-shell" id="mainLogo">
            <img src="./assets/tennis-rank-logo.webp" alt="Logo Tennis Rank" />
          </div>
        </div>
        <p class="badge">Tennis Rank · Tennis Levels</p>
        <h1 id="login-title">Se connecter</h1>
        <p class="lead">Accède à tes apprentissages et ton suivi.</p>

        <div id="msg" aria-live="polite" style="min-height:1.5em"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">ID / email</label>
            <input id="email" name="email" type="email" placeholder="ton email" required autocomplete="email" />
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="password-row">
              <input id="password" name="password" type="password" placeholder="mot de passe" required autocomplete="current-password" style="flex:1" />
              <button type="button" class="toggle-pass" id="togglePass" aria-pressed="false" title="Afficher / masquer le mot de passe">Afficher</button>
            </div>
          </div>

          <div class="controls">
            <label class="inline"><input id="remember" type="checkbox" /> Se souvenir</label>
            <button type="button" class="secondary" id="forgotBtn">Mot de passe oublié</button>
          </div>

          <button class="primary-btn" type="submit" id="signInBtn">Se connecter</button>
        </form>

        <p class="divider">ou avec</p>

        <div class="google-zone">
          <div class="google-wrap" id="googleWrap">
            <div class="google-bg" aria-hidden="true"></div>
            <div id="googleBtnContainer"></div>
            <button id="googleFallback" class="google-btn-custom" type="button">
              <span class="google-logo" aria-hidden="true"></span>
              <span class="google-text">Se connecter avec Google</span>
            </button>
          </div>
        </div>

        <p class="small">Pas encore de compte ? <a href="signupt1.html">Créer un compte</a></p>

        <div class="legal-links">
          <a href="conditions-utilisation.html">Conditions d’utilisation</a>
          <a href="politique-confidentialite.html">Règlement de confidentialité</a>
        </div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const msg = $('msg');
      const ADMIN_LOGIN_ID = 'adm:tennisdev';
      const ADMIN_LOGIN_PASSWORD = '1515';

      function hideSplash() {
        const s = $('splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(() => { s.style.display = 'none'; }, 1200);
      }
      window.addEventListener('load', () => setTimeout(hideSplash, 1100));

      (function initParticles(){
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = innerWidth;
        let h = canvas.height = innerHeight;
        const particles = [];
        const count = Math.round((w*h)/60000);

        function rand(min,max){return Math.random()*(max-min)+min}

        function create(){
          for(let i=0;i<count;i++){
            particles.push({
              x: rand(0,w),
              y: rand(0,h),
              r: rand(0.6,2.6),
              vx: rand(-0.05,0.05),
              vy: rand(-0.03,0.18),
              alpha: rand(0.06,0.22)
            });
          }
        }
        create();

        function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
        addEventListener('resize', resize);

        function frame(){
          ctx.clearRect(0,0,w,h);
          for(let p of particles){
            p.x += p.vx;
            p.y += p.vy;
            if(p.y > h + 20){ p.y = -10; p.x = Math.random()*w }
            if(p.x < -20) p.x = w+20; if(p.x> w+20) p.x=-20
            ctx.beginPath();
            ctx.fillStyle = `rgba(185,205,255,${p.alpha})`;
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fill();
          }
          const g = ctx.createLinearGradient(0,0,w,h);
          g.addColorStop(0,'rgba(36,61,114,0.02)');
          g.addColorStop(1,'rgba(11,16,32,0.02)');
          ctx.fillStyle = g;
          ctx.fillRect(0,0,w,h);
          requestAnimationFrame(frame);
        }
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if(!reduce) frame();
      })();

      $('togglePass').addEventListener('click', () => {
        const p = $('password');
        const shown = p.type === 'text';
        p.type = shown ? 'password' : 'text';
        $('togglePass').textContent = shown ? 'Afficher' : 'Masquer';
        $('togglePass').setAttribute('aria-pressed', String(!shown));
      });

      function createRipple(e, el){
        const rect = el.getBoundingClientRect();
        const d = Math.max(rect.width, rect.height)*1.6;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = d + 'px';
        ripple.style.left = (e.clientX - rect.left - d/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - d/2) + 'px';
        el.appendChild(ripple);
        ripple.animate([{transform:'scale(0)',opacity:0.45},{transform:'scale(1)',opacity:0}],{duration:520,easing:'cubic-bezier(.2,.9,.2,1)'}).onfinish = () => ripple.remove();
      }

      document.addEventListener('pointerdown', (ev) => {
        const p = ev.target.closest('.primary-btn, .google-btn-custom');
        if(p) createRipple(ev, p);
      });

      $('forgotBtn').addEventListener('click', () => {
        window.location.href = 'train.html';
      });

      $('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        msg.textContent = '';
        const email = $('email').value.trim();
        const password = $('password').value;
        if (!email || !password) {
          msg.innerHTML = '<div class="error">Merci de renseigner email et mot de passe.</div>';
          return;
        }

        if (email === ADMIN_LOGIN_ID && password === ADMIN_LOGIN_PASSWORD) {
          localStorage.setItem('tr_admin_redirect', '1');
          msg.innerHTML = '<div style="color:#bff7d1;padding:8px;border-radius:8px">Redirection vers le portail admin…</div>';
          setTimeout(() => {
            window.location.href = 'adm8n/login.html';
          }, 500);
          return;
        }

        localStorage.setItem('tr_email', email);
        localStorage.setItem('tr_pseudo', email.split('@')[0] || 'Utilisateur');
        if ($('remember').checked) localStorage.setItem('tr_remember', '1');
        msg.innerHTML = '<div style="color:#bff7d1;padding:8px;border-radius:8px">Connexion réussie — redirection…</div>';

        setTimeout(() => {
          window.location.href = 'train.html';
        }, 800);
      });

      function showGoogleFallback() {
        const fb = $('googleFallback');
        fb.style.display = 'inline-flex';
        fb.addEventListener('click', (ev) => {
          createRipple(ev, fb);
          setTimeout(() => {
            localStorage.setItem('tr_pseudo', 'GoogleUser');
            localStorage.setItem('tr_email', 'googleuser@example.com');
            alert('Connecté via Google (simulation)');
            window.location.href = 'train.html';
          }, 320);
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        showGoogleFallback();
      });

      (function addLogoTilt(){
        const logo = $('mainLogo');
        if(!logo) return;
        let rect, mouseX=0, mouseY=0;
        function update(){
          if(!rect) rect = logo.getBoundingClientRect();
          const dx = (mouseX - (rect.left + rect.width/2));
          const dy = (mouseY - (rect.top + rect.height/2));
          const rx = Math.max(Math.min(dy/20,8),-8);
          const ry = Math.max(Math.min(dx/20,8),-8);
          logo.style.transform = `perspective(600px) rotateX(${ -rx }deg) rotateY(${ ry }deg)`;
          requestAnimationFrame(update);
        }
        document.addEventListener('mousemove', (e)=>{ mouseX=e.clientX; mouseY=e.clientY });
        if(!matchMedia('(pointer: coarse)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches){ update(); }
      })();
    </script>
  </body>
</html>
