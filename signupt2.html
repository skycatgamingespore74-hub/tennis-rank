<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tennis Rank — Inscription (2/2)</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial;--muted:#aab6d5;--accent:#79a9ff}
      body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%, #243d72,#0b1020 60%);color:#f4f7ff;display:grid;place-items:center;padding:24px}
      main{width:min(100%,520px)}
      .card{padding:20px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.06));border:1px solid rgba(170,190,230,0.12)}
      h1{margin:0 0 8px}
      p.lead{margin:0 0 12px;color:var(--muted)}
      .field{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
      input{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(12,18,32,0.45);color:inherit}
      .primary{background:linear-gradient(90deg,var(--accent),#5d8dff);padding:12px;border-radius:999px;border:none;color:#081126;font-weight:800;cursor:pointer}
      .secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px;border-radius:10px;cursor:pointer;color:var(--muted)}
      .small{color:var(--muted);font-size:.95rem}
      .rules{font-size:.9rem;color:var(--muted);margin-top:8px}
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="region" aria-labelledby="insc2">
        <h1 id="insc2">Inscription — Étape 2</h1>
        <p class="lead">Choisis un mot de passe sécurisé et accepte les conditions.</p>

        <div id="msg" aria-live="polite" style="min-height:1.4em"></div>

        <form id="step2" novalidate>
          <div class="field">
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" placeholder="Au moins 8 caractères" required />
          </div>

          <div class="field">
            <label for="confirm">Confirmer le mot de passe</label>
            <input id="confirm" name="confirm" type="password" placeholder="Retaper le mot de passe" required />
          </div>

          <label style="display:flex;gap:8px;align-items:center">
            <input id="terms" type="checkbox" /> J'accepte les <a href="#" style="color:var(--accent)">conditions</a>
          </label>

          <div class="rules">
            Règles : au moins 8 caractères. Utilisez une combinaison de lettres et de chiffres pour plus de sécurité.
          </div>

          <div style="display:flex;gap:8px;margin-top:12px">
            <button type="submit" class="primary">Créer le compte</button>
            <a href="signupt1.html" class="secondary" style="text-decoration:none;display:inline-flex;align-items:center;padding:8px 12px;border-radius:8px">Retour</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const msg = $('msg');

      // On load, prefill email/pseudo if available
      document.addEventListener('DOMContentLoaded', () => {
        const email = localStorage.getItem('tr_signup_email');
        const pseudo = localStorage.getItem('tr_signup_pseudo');
        if (!email || !pseudo) {
          msg.innerHTML = '<div style="color:#ffd1d1;padding:8px;border-radius:8px">Données manquantes de l\'étape précédente. Vous allez être redirigé.</div>';
          setTimeout(() => window.location.href = 'signupt1.html', 1200);
        }
      });

      $('step2').addEventListener('submit', (e) => {
        e.preventDefault();
        msg.textContent = '';
        const pw = $('password').value;
        const conf = $('confirm').value;
        const terms = $('terms').checked;

        if (pw.length < 8) {
          msg.innerHTML = '<div style="color:#ffd1d1;padding:8px;border-radius:8px">Le mot de passe doit contenir au moins 8 caractères.</div>';
          return;
        }
        if (pw !== conf) {
          msg.innerHTML = '<div style="color:#ffd1d1;padding:8px;border-radius:8px">Les mots de passe ne correspondent pas.</div>';
          return;
        }
        if (!terms) {
          msg.innerHTML = '<div style="color:#ffd1d1;padding:8px;border-radius:8px">Vous devez accepter les conditions.</div>';
          return;
        }

        // Récupérer données précédentes
        const fullname = localStorage.getItem('tr_signup_fullname') || '';
        const pseudo = localStorage.getItem('tr_signup_pseudo') || '';
        const email = localStorage.getItem('tr_signup_email') || '';

        // Simuler création de compte (à remplacer par appel API)
        const user = { fullname, pseudo, email, passwordHash: btoa(pw), createdAt: new Date().toISOString() };
        localStorage.setItem('tr_user_' + email, JSON.stringify(user));
        localStorage.removeItem('tr_signup_fullname');
        localStorage.removeItem('tr_signup_pseudo');
        localStorage.removeItem('tr_signup_email');

        msg.innerHTML = '<div style="color:#bff7d1;padding:8px;border-radius:8px">Compte créé ! Redirection…</div>';
        setTimeout(() => {
          localStorage.setItem('tr_pseudo', pseudo);
          localStorage.setItem('tr_email', email);
          window.location.href = 'deverror.html';
        }, 900);
      });
    </script>
  </body>
</html>
