<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tennis Rank — Inscription (2/2)</title>
    <style>
      :root { color-scheme: dark; --bg: #0b1020; --card-from: rgba(255,255,255,0.03); --card-to: rgba(0,0,0,0.08); --accent-1: #79a9ff; --accent-2: #5d8dff; --muted: #aab6d5; --text: #f4f7ff; --border: rgba(170,190,230,0.12); }
      *{box-sizing:border-box} html,body{height:100%} body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 0%, #243d72, var(--bg) 60%); color:var(--text); font-family: system-ui,-apple-system,"Segoe UI",sans-serif }
      #bg-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none }
      main{ width:min(100%,620px); z-index:1 }
      .card{ position:relative; overflow:hidden; padding:22px 20px 18px; border-radius:18px; background:linear-gradient(180deg,var(--card-from),var(--card-to)); border:1px solid var(--border); box-shadow:0 18px 44px rgba(0,0,0,.38) }
      .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px }
      .brand{ display:flex; align-items:center; gap:10px; font-weight:800 }
      .mini-logo{ width:38px; height:38px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--accent-1),var(--accent-2)) }
      h1{ margin:0 0 8px; font-size:clamp(1.6rem,5vw,2.2rem) }
      .lead{ margin:0 0 16px; color:var(--muted); }
      .field{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px }
      label{ font-weight:700; color:#dbe8ff }
      input,select{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(170,190,230,0.12); background:linear-gradient(180deg, rgba(12,18,32,0.52), rgba(12,18,32,0.42)); color:var(--text) }
      .settings-grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px }
      .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px }
      .primary{ background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); padding:12px 18px; border-radius:999px; color:#081126; font-weight:800 }
      .secondary{ background:transparent; border:1px solid rgba(255,255,255,0.04); padding:10px 14px; border-radius:12px }
      .actions{ display:flex; gap:8px; margin-top:16px }
      .ripple{ position:absolute; border-radius:50%; transform:scale(0); opacity:.6; background:rgba(255,255,255,.18); pointer-events:none }
      .lang{ position:absolute; top:12px; right:12px }
      .lang select{ padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:var(--text) }
      @media(max-width:560px){ body{padding:18px} .card{padding:18px 16px} .settings-grid{ grid-template-columns:1fr } }
    </style>
  </head>
  <body>
    <div class="lang">
      <select id="langSelect" aria-label="Sélection de la langue">
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <main>
      <div class="card" role="region" aria-labelledby="insc2">
        <div class="topbar">
          <div class="brand"><span class="mini-logo"><img src="./assets/tennis-rank-logo.webp" alt="Tennis Rank logo" style="width:24px;height:24px;border-radius:6px"/></span><span>Tennis Rank</span></div>
          <div class="step-indicator"><span class="dot active"></span><span class="dot active"></span> <span>Étape 2 / 2</span></div>
        </div>
        <div class="progress"><span></span></div>
        <h1 id="insc2">Sécurité & paramètres</h1>
        <p class="lead">Crée un mot de passe robuste et configure ton profil de jeu pour des leçons adaptées.</p>
        <div id="msg" class="msg" aria-live="polite"></div>

        <form id="step2" novalidate>
          <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" placeholder="Au moins 8 caractères" required /></div>
          <div class="field"><label for="confirm">Confirmer le mot de passe</label><input id="confirm" name="confirm" type="password" placeholder="Retaper le mot de passe" required /></div>

          <div class="settings-grid">
            <div class="field"><label for="maxLeader">Max Leader</label><input id="maxLeader" type="number" min="1" max="10" value="5" /></div>
            <div class="field"><label for="maxPlayers">Max Players</label><input id="maxPlayers" type="number" min="2" max="32" value="16" /></div>
          </div>

          <div class="field">
            <label for="focus">Focus de training</label>
            <select id="focus">
              <option value="Engagement">Engagement</option>
              <option value="Tactique">Tactique</option>
              <option value="Tournoi">Tournoi</option>
              <option value="Jeux">Jeux</option>
            </select>
          </div>

          <div class="chip-row">
            <span class="chip">Niveau: <strong id="summaryLevel">Débutant</strong></span>
            <span class="chip">Objectif: <strong id="summaryGoal">Loisir</strong></span>
            <span class="chip">Fréquence: <strong id="summaryFrequency">1 fois / semaine</strong></span>
          </div>

          <label class="checkbox-row"><input id="terms" type="checkbox" /> J'accepte les conditions d'utilisation</label>
          <div class="rules">Règles : au moins 8 caractères avec lettres + chiffres pour sécuriser le compte.</div>

          <div class="actions">
            <button type="submit" class="primary">Créer le compte</button>
            <a href="signupt1.html" class="secondary">Retour</a>
          </div>
        </form>
      </div>
    </main>

    <script>
      (function(){
        const sel = document.getElementById('langSelect');
        function applyLocale(loc){ if(!loc) return; document.documentElement.lang = loc; localStorage.setItem('tr_locale', loc); }
        let saved = localStorage.getItem('tr_locale') || (navigator.language||'fr').split('-')[0] || 'fr';
        if(['fr','de','en','zh'].indexOf(saved)===-1) saved='fr';
        sel.value = saved; applyLocale(saved); sel.addEventListener('change',(e)=>{ applyLocale(e.target.value); location.reload(); });
      })();

      (function initParticles(){
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = innerWidth; let h = canvas.height = innerHeight; const particles = []; const count = Math.round((w*h)/60000);
        function rand(min,max){ return Math.random()*(max-min)+min }
        for(let i=0;i<count;i++){ particles.push({ x: rand(0,w), y: rand(0,h), r: rand(0.6,2.6), vx: rand(-0.05,0.05), vy: rand(-0.03,0.18), alpha: rand(0.06,0.22) }); }
        function resize(){ w = canvas.width = innerWidth; h = canvas.height = innerHeight }
        addEventListener('resize', resize);
        function frame(){ ctx.clearRect(0,0,w,h); for(const p of particles){ p.x += p.vx; p.y += p.vy; if(p.y>h+20){ p.y=-10; p.x=Math.random()*w } if(p.x<-20) p.x=w+20; if(p.x> w+20) p.x=-20; ctx.beginPath(); ctx.fillStyle = `rgba(185,205,255,${p.alpha})`; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); } requestAnimationFrame(frame); }
        if(!matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
      })();
    </script>
  </body>
</html>
