<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard — Tennis Rank</title>
  <style>
    :root{ --violet-1:#7b61ff; --violet-2:#b48bff; --bg:#0b1020; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:radial-gradient(circle at 20% 0%, #3b2b6b, var(--bg) 60%);color:#ecf4ff;padding:24px}
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(59,43,107,0.96),rgba(11,16,32,0.98));z-index:6}
    .splash .logo-shell{width:180px;height:180px;border-radius:26px;background:linear-gradient(135deg,var(--violet-1),var(--violet-2));display:flex;align-items:center;justify-content:center;box-shadow:0 32px 80px rgba(59,43,107,0.28)}
    .card{width:min(100%,760px);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));border-radius:22px;padding:26px;border:1px solid rgba(255,255,255,0.04);z-index:2;position:relative}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .brand{font-weight:800}
    .logout{background:linear-gradient(90deg,var(--violet-1),var(--violet-2));padding:8px 12px;border-radius:999px;color:#07111f;text-decoration:none;font-weight:800}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    .tile{background:rgba(255,255,255,0.02);padding:14px;border-radius:12px}
    a.link{color:#e8d9ff}
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="splash" id="splash" role="img" aria-hidden="true"><div class="logo-shell"><img src="../assets/tennis-rank-logo.webp" alt="Tennis Rank" style="width:120px;height:120px;border-radius:20px"></div></div>

  <script src="auth.js"></script>
  <script>
    window.ADM && window.ADM.requireAuth && window.ADM.requireAuth();
    function hideSplash(){const s=document.getElementById('splash');if(!s) return; s.classList.add('hide'); setTimeout(()=>{s.style.display='none'},1200)}
    window.addEventListener('load', ()=>setTimeout(hideSplash,1100));
    (function initParticles(){const canvas=document.getElementById('bg-canvas');const ctx=canvas.getContext('2d');let w=canvas.width=innerWidth;let h=canvas.height=innerHeight;const particles=[];const count=Math.round((w*h)/60000);function rand(min,max){return Math.random()*(max-min)+min}function create(){for(let i=0;i<count;i++){particles.push({x:rand(0,w),y:rand(0,h),r:rand(0.6,2.6),vx:rand(-0.05,0.05),vy:rand(-0.03,0.18),alpha:rand(0.06,0.22)})}}create();function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}addEventListener('resize',resize);function frame(){ctx.clearRect(0,0,w,h);for(let p of particles){p.x+=p.vx;p.y+=p.vy;if(p.y>h+20){p.y=-10;p.x=Math.random()*w}if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;ctx.beginPath();ctx.fillStyle=`rgba(180,160,255,${p.alpha})`;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(59,43,107,0.02)');g.addColorStop(1,'rgba(11,16,32,0.02)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);requestAnimationFrame(frame)}const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduce)frame();})();
  </script>

  <div class="card">
    <header>
      <div class="brand">Tennis Rank — Admin</div>
      <a class="logout" href="#" id="logout">Se déconnecter</a>
    </header>
    <main>
      <h1>Tableau de bord</h1>
      <p>Bienvenue — espace administrateur.</p>
      <div class="tiles">
        <div class="tile"><strong>Utilisateurs</strong><div style="margin-top:8px;color:#b9c8e1">128 comptes</div></div>
        <div class="tile"><strong>Évaluations</strong><div style="margin-top:8px;color:#b9c8e1">39 en cours</div></div>
        <div class="tile"><strong>Sessions</strong><div style="margin-top:8px;color:#b9c8e1">24 actives</div></div>
      </div>

      <section style="margin-top:18px">
        <a class="link" href="users.html">Gérer les utilisateurs</a> — <a class="link" href="stats.html">Voir les stats</a>
      </section>
    </main>
  </div>

  <script>
    document.getElementById('logout').addEventListener('click', function(e){ e.preventDefault(); window.ADM.clearToken(); window.location.href='../Connect.html'; });
  </script>
</body>
</html>
