<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Tennis Rank</title>
  <style>
    :root{ --bg1:#0b1020; --violet-1:#7b61ff; --violet-2:#b48bff; --muted:#b9b0d9; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%, #3b2b6b, var(--bg1) 60%);color:#f4f7ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(59,43,107,0.96),rgba(11,16,32,0.98));z-index:6}
    .splash .logo-shell{width:180px;height:180px;border-radius:26px;background:linear-gradient(135deg,var(--violet-1),var(--violet-2));display:flex;align-items:center;justify-content:center;box-shadow:0 32px 80px rgba(59,43,107,0.28)}

    .card{width:100%;max-width:460px;padding:22px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));border:1px solid rgba(255,255,255,0.04);z-index:2;position:relative}
    label{display:block;margin-bottom:6px;font-weight:700;color:#efeaff}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
    .btn{margin-top:12px;padding:12px;border-radius:999px;border:none;background:linear-gradient(90deg,var(--violet-1),var(--violet-2));color:#07111f;font-weight:800;width:100%;cursor:pointer}
    .error{color:#ffd1d1;margin-top:10px}
    .link{margin-top:12px;display:block;color:#e8d9ff;text-decoration:none}
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="splash" id="splash" role="img" aria-hidden="true">
    <div class="logo-shell"><img src="../assets/tennis-rank-logo.webp" alt="Tennis Rank" style="width:120px;height:120px;border-radius:20px"></div>
  </div>

  <div class="card">
    <h2>Portail admin — connexion</h2>
    <form id="login">
      <label for="id">Identifiant</label>
      <input id="id" name="id" type="text" value="" autocomplete="username" />
      <label for="pw">Mot de passe</label>
      <input id="pw" name="pw" type="password" autocomplete="current-password" />
      <button class="btn" type="submit">Se connecter</button>
    </form>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
    <a class="link" href="../home.html">Retour accueil</a>
  </div>

  <!-- Optional auth helper (if present) -->
  <script src="auth.js"></script>

  <script>
    // splash
    function hideSplash(){const s=document.getElementById('splash');if(!s)return; s.classList.add('hide'); setTimeout(()=>{s.style.display='none'},1200)}
    window.addEventListener('load', ()=>setTimeout(hideSplash,1100));

    // robust particle init (handles DPR & resize)
    (function initParticles(){
      const canvas = document.getElementById('bg-canvas'); if(!canvas) return;
      const ctx = canvas.getContext('2d');
      let w=0,h=0, particles=[];
      function rand(min,max){return Math.random()*(max-min)+min}
      function createParticles(width,height){particles = []; const count = Math.max(8, Math.round((width*height)/60000)); for(let i=0;i<count;i++){particles.push({x:rand(0,width), y:rand(0,height), r:rand(0.6,2.6), vx:rand(-0.05,0.05), vy:rand(-0.03,0.18), alpha:rand(0.06,0.22)})}}
      function resize(){
        const dpr = window.devicePixelRatio || 1;
        w = Math.round(window.innerWidth);
        h = Math.round(window.innerHeight);
        canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        if(particles.length === 0) createParticles(w,h);
      }
      addEventListener('resize', resize); resize();
      function frame(){
        ctx.clearRect(0,0,w,h);
        for(const p of particles){ p.x += p.vx; p.y += p.vy; if(p.y > h + 20){ p.y = -10; p.x = Math.random()*w } if(p.x < -20) p.x = w+20; if(p.x > w+20) p.x = -20; ctx.beginPath(); ctx.fillStyle = `rgba(185,205,255,${p.alpha})`; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
        const g = ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'rgba(59,43,107,0.02)'); g.addColorStop(1,'rgba(11,16,32,0.02)'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
        requestAnimationFrame(frame);
      }
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!reduce) frame();
    })();

    // auth logic (fallback in-page)
    const CREDENTIALS = (window.ADM && window.ADM.CREDENTIALS) ? window.ADM.CREDENTIALS : {'skycat74':'Majoly.7473','adm:tennisdev':'1515'};
    const form = document.getElementById('login');
    const err = document.getElementById('error');

    function isAuthenticated(){
      if(window.ADM){ if(typeof window.ADM.isAuthenticated === 'function') return window.ADM.isAuthenticated(); return !!window.ADM.isAuthenticated; }
      // fallback: check sessionStorage token
      try{ const t = sessionStorage.getItem('tr_admin_token'); if(!t) return false; const obj = JSON.parse(t); return obj && obj.exp && obj.exp > Date.now(); }catch(e){return false}
    }

    if(isAuthenticated()){ window.location.replace('dashboard.html'); }

    form.addEventListener('submit', function(e){
      e.preventDefault(); err.textContent='';
      const id = document.getElementById('id').value.trim();
      const pw = document.getElementById('pw').value;
      if(!id || !pw){ err.textContent = 'Veuillez renseigner identifiant et mot de passe.'; return; }

      if(CREDENTIALS[id] && CREDENTIALS[id] === pw){
        // prefer auth helper if available
        if(window.ADM && typeof window.ADM.setToken === 'function'){
          try{ window.ADM.setToken(id, 60); }catch(e){ /* ignore */ }
        } else {
          // fallback token into sessionStorage
          const exp = Date.now() + 60*60*1000;
          try{ sessionStorage.setItem('tr_admin_token', JSON.stringify({ user: id, exp })); }catch(e){ /* ignore */ }
        }
        // redirect to dashboard
        window.location.href = 'dashboard.html';
        return;
      }

      err.textContent = 'Identifiant ou mot de passe incorrect.';
    });
  </script>
</body>
</html>
